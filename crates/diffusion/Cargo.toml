[package]
name = "diffusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diffusion-core = { path = "../diffusion-core" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
screenshot = ["dep:image"]

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland", "rwh_06"] }
